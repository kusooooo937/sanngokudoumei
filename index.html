<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>複数部屋チャット</title>
  <style>
    body {
      font-family: monospace;
      background: #fff;
      color: #000;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    h2 {
      font-size: 1rem;
      margin: 20px auto 5px;
      max-width: 800px;
      width: 95%;
      border-bottom: 2px solid #000;
      padding-bottom: 4px;
    }

    /* ホーム画面 */
    #home {
      width: 95%;
      max-width: 800px;
      margin: 20px auto;
    }

    #searchArea, #createArea {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      margin-bottom: 10px;
    }

    #home input, #home button {
      padding: 8px;
      font-family: monospace;
      font-size: 1rem;
    }

    #createArea {
      border: 1px dashed #999;
      padding: 10px;
      border-radius: 6px;
    }

    .boardList {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .boardCard {
      position: relative;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      background: #f9f9f9;
      min-width: 120px;
      max-width: 220px;
    }
    .boardCard:hover {
      background: #eef6ff;
      border-color: #0066cc;
    }
    .boardName {
      font-weight: bold;
      word-break: break-word;
      padding-right: 16px;
    }
    .boardMeta {
      color: #888;
      font-size: 0.85rem;
      margin-top: 2px;
    }
    .boardTags {
      margin-top: 4px;
    }
    .tag {
      display: inline-block;
      background: #e0eefc;
      color: #0066cc;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 0.8rem;
      margin: 2px 2px 0 0;
    }
    .emptyNote {
      color: #999;
      font-size: 0.9rem;
    }
    .deleteBtn {
      position: absolute;
      top: 2px;
      right: 2px;
      border: none;
      background: transparent;
      color: #cc0000;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 5px;
    }
    .deleteBtn:hover {
      color: #fff;
      background: #cc0000;
      border-radius: 50%;
    }

    /* チャット画面 */
    #chatContainer {
      display: none;
      width: 95%;
      max-width: 800px;
      margin: 20px auto;
    }

    #chat {
      width: 100%;
      height: 60vh;
      border: 1px solid #ccc;
      overflow-y: auto;
      padding: 10px;
      background: #f9f9f9;
      box-sizing: border-box;
    }

    .message {
      border-bottom: 1px dashed #ccc;
      padding: 5px 0;
      word-break: break-word;
    }

    .name { color: #0066cc; margin-right: 5px; }
    .time { color: #888; margin-left: 5px; }
    .text { color: #000; }

    #inputArea {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    #inputArea input[type=text] {
      padding: 8px;
      font-family: monospace;
      flex: 1;
      min-width: 100px;
    }

    #inputArea input[type=file] {
      flex-basis: 100%;
    }

    #inputArea button {
      padding: 8px 16px;
      font-family: monospace;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      #inputArea {
        flex-direction: column;
      }
      #inputArea input[type=text], #inputArea button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>複数部屋チャット</h1>

  <!-- ホーム画面 -->
  <div id="home">
    <div id="searchArea">
      <input id="searchInput" type="text" placeholder="板名や#タグで検索">
      <button id="searchBtn">検索</button>
    </div>

    <div id="createArea">
      <input id="newBoardName" type="text" placeholder="新しい板名">
      <input id="newBoardTags" type="text" placeholder="#タグ1 #タグ2 (任意)">
      <button id="createBtn">板を作る</button>
    </div>

    <div id="searchResultsSection" style="display:none;">
      <h2>検索結果</h2>
      <div id="searchResults" class="boardList"></div>
    </div>

    <h2>人気な板</h2>
    <div id="popularBoards" class="boardList"></div>

    <h2>最近入った板</h2>
    <div id="recentRooms" class="boardList"></div>
  </div>

  <!-- チャット画面 -->
  <div id="chatContainer">
    <div id="chat"></div>
    <div id="inputArea">
      <input id="nameInput" type="text" placeholder="名前">
      <input id="messageInput" type="text" placeholder="メッセージ">
      <input id="fileInput" type="file" accept="image/*">
      <button id="sendBtn">送信</button>
    </div>
    <p style="text-align:center;"><a href="#" id="backHome">ホームに戻る</a></p>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="chat.js"></script>
</body>
</html>
